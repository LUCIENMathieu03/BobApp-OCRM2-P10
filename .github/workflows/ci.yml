name: BobApp ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 11
      - name: Maven test
        working-directory: back
        run: mvn test

      - name: Test Report
        uses: phoenix-actions/test-reporting@v8
        id: test-report
        if: success() || failure()
        with:
          name: Java Tests
          path: back/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Generate back-end report
        uses: actions/upload-artifact@v7
        with:
          name: Jacoco
          path: back/target/site/jacoco/*.xml
