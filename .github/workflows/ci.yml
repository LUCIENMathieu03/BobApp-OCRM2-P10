name: BobApp ci #nom du workflow
on: #a quel moment le workflow se déclanche
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  #rajouter un dispacht qui permet de lancer la pipeline manuelement (workflow_dispatch)

permissions:
  checks: write
  contents: read

jobs:
  Back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 11
      - name: Maven test
        working-directory: back
        run: mvn test
      - name: Test Report
        uses: phoenix-actions/test-reporting@v8
        id: test-report
        if: success() || failure()
        with:
          name: Java tests
          path: back/target/surefire-reports/*.xml
          reporter: java-junit
      - name: Generate back-end report
        uses: actions/upload-artifact@v7
        with:
          name: Back-end report
          path: back/target/

  Front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up node environment
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Installing the project
        working-directory: front
        run: npm ci

      - name: Angular test
        working-directory: front
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Generate front-end report
        uses: actions/upload-artifact@v7
        with:
          name: Front-end report
          path: front/coverage/bobapp/

  Sonar:
    needs: [Front, Back] #doit s'éxecuter uniquemnt si le back et le front on réussi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: "zulu" # Alternative distribution options are available.

      - name: Cache SonarQube packages # DEBUT des optimisation (proposées par la doc sonar)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('back/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2 # FIN des optimisation (proposées par la doc sonar)

      - name: Download back build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Back-end report
          path: back/target/

      - name: Download front-end report artifacts
        uses: actions/download-artifact@v8
        with:
          name: Front-end report
          path: front/coverage/bobapp/

      - name: Official SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
